<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Shop Bijoux - Votre boutique en ligne de bijoux de qualité">
<title>Shop Bijoux - Boutique de Bijoux en Ligne</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #333;
  line-height: 1.6;
  font-size: 16px;
}

/* Skip link pour accessibilité */
.skip-link {
  position: absolute;
  top: -40px;
  left: 0;
  background: #000;
  color: white;
  padding: 8px;
  text-decoration: none;
  z-index: 100;
}

.skip-link:focus {
  top: 0;
}

a {
  text-decoration: underline;
}

a:focus-visible,
button:focus-visible {
  outline: 2px solid #2980b9;
  outline-offset: 2px;
}

header {
  background: #2c3e50;
  color: white;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h1 {
  font-size: 28px;
}

.panier-icon {
  display: flex;
  gap: 10px;
  align-items: center;
  font-size: 18px;
}

#panier-count {
  background: #e74c3c;
  padding: 2px 8px;
  border-radius: 50%;
  font-weight: bold;
}

main {
  max-width: 1200px;
  margin: 30px auto;
  padding: 0 20px;
}

h2 {
  margin-bottom: 20px;
  font-size: 24px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 20px;
  margin-bottom: 40px;
  list-style: none;
}

.produit {
  background: white;
  border-radius: 8px;
  padding: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  text-align: center;
}

.produit article {
  display: flex;
  flex-direction: column;
  height: 100%;
}

.produit h3 {
  margin: 10px 0;
  color: #2c3e50;
  flex-grow: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.produit .prix {
  font-size: 20px;
  font-weight: bold;
  color: #e74c3c;
  margin: 10px 0;
}

.produit button {
  background: #3498db;
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: background-color 0.2s ease;
}

.produit button:hover {
  background: #2980b9;
}

.produit button:active {
  background: #1f5c8d;
}

.produit button:focus-visible {
  outline: 2px solid #2c3e50;
  outline-offset: 2px;
}

.panier-section {
  background: white;
  padding: 20px;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.panier-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid #eee;
}

.panier-item-info {
  flex: 1;
}

.panier-item-actions {
  display: flex;
  gap: 10px;
}

.panier-item-actions button {
  background: #e74c3c;
  color: white;
  border: none;
  padding: 5px 10px;
  border-radius: 4px;
  cursor: pointer;
  font-weight: 600;
  transition: background-color 0.2s ease;
  min-width: 40px;
  min-height: 40px;
}

.panier-item-actions button:hover {
  background: #c0392b;
}

.panier-item-actions button:active {
  background: #a02d23;
}

.panier-item-actions button:focus-visible {
  outline: 2px solid #2c3e50;
  outline-offset: 2px;
}

#panier-total {
  text-align: right;
  font-size: 18px;
  font-weight: bold;
  margin-top: 20px;
  padding-top: 20px;
  border-top: 2px solid #eee;
}

.panier-vide {
  text-align: center;
  padding: 20px;
  color: #666;
}

/* Respect des préférences utilisateur */
@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }

  html {
    scroll-behavior: auto;
  }
}

@media (prefers-color-scheme: dark) {
  body {
    background: #1a1a1a;
    color: #e0e0e0;
  }

  .produit {
    background: #2a2a2a;
    color: #e0e0e0;
  }

  .panier-section {
    background: #2a2a2a;
    color: #e0e0e0;
  }

  .produit h3 {
    color: #e0e0e0;
  }
}

/* Meilleure lisibilité sur tous les appareils */
@media (max-width: 768px) {
  header {
    flex-direction: column;
    gap: 15px;
  }

  header h1 {
    font-size: 24px;
  }

  main {
    padding: 0 15px;
  }
}

/* Focus visible pour tous les éléments interactifs */
header a:focus-visible,
footer a:focus-visible {
  outline: 2px solid #3498db;
  outline-offset: 2px;
}

</style>
</head>
<body>
<a href="#main-content" class="skip-link">Aller au contenu principal</a>

<header role="banner">
  <h1>Shop Bijoux</h1>
  <div class="panier-icon" role="status" aria-live="polite" aria-atomic="true">
    <span aria-label="Panier">🛒</span>
    <span id="panier-count" aria-label="Nombre d'articles dans le panier">0</span>
  </div>
</header>

<main id="main-content">
  <section aria-labelledby="produits-title">
    <h2 id="produits-title">Nos Produits</h2>
    <div id="produits-container" class="grid" role="list">
      <!-- Les produits seront générés ici par JavaScript -->
    </div>
  </section>

  <section aria-labelledby="panier-title">
    <h2 id="panier-title">Votre Panier</h2>
    <div id="panier-container" role="list">
      <!-- Le contenu du panier sera généré ici par JavaScript -->
    </div>
    <div id="panier-total"></div>
  </section>
</main>

<footer role="contentinfo">
  <p>&copy; 2024 Shop Bijoux. Tous droits réservés.</p>
</footer>

<script>
// Initialisation du panier à partir de localStorage
let panier = JSON.parse(localStorage.getItem('panier')) || [];

// Produits exemple
const produits = [
  { id: 1, nom: 'Collier Or', prix: 45.99 },
  { id: 2, nom: 'Bracelet Argent', prix: 32.50 },
  { id: 3, nom: 'Boucles Perles', prix: 28.99 },
  { id: 4, nom: 'Bague Diamant', prix: 89.99 },
  { id: 5, nom: 'Pendentif Cristal', prix: 55.00 },
  { id: 6, nom: 'Chaîne Or Rose', prix: 65.99 }
];

// Synchroniser le panier avec localStorage
function sauvegarderPanier() {
  localStorage.setItem('panier', JSON.stringify(panier));
  afficherPanier();
  mettreAJourCompteur();
}

// Afficher les produits
function afficherProduits() {
  const container = document.getElementById('produits-container');
  container.innerHTML = produits.map(p => `
    <li class="produit" role="listitem">
      <article aria-label="${p.nom}">
        <h3>${p.nom}</h3>
        <p class="prix" aria-label="Prix: ${p.prix} euros">${p.prix}€</p>
        <button onclick="ajouterAuPanier(${p.id}, '${p.nom}', ${p.prix})" aria-label="Ajouter ${p.nom} au panier">Ajouter</button>
      </article>
    </li>
  `).join('');
}

// Ajouter un produit au panier
function ajouterAuPanier(id, nom, prix) {
  const item = panier.find(p => p.id === id);
  if (item) {
    item.quantite++;
  } else {
    panier.push({ id, nom, prix, quantite: 1 });
  }
  sauvegarderPanier();
}

// Afficher le panier
function afficherPanier() {
  const container = document.getElementById('panier-container');
  const totalEl = document.getElementById('panier-total');

  if (panier.length === 0) {
    container.innerHTML = '<p class="panier-vide" role="status" aria-live="polite">Votre panier est vide</p>';
    totalEl.innerHTML = '';
    return;
  }

  container.innerHTML = panier.map(item => `
    <div class="panier-item" role="listitem">
      <div class="panier-item-info">
        <strong>${item.nom}</strong> - <span aria-label="Prix unitaire: ${item.prix} euros">${item.prix}€</span> x <span aria-label="Quantité: ${item.quantite}">${item.quantite}</span>
      </div>
      <div class="panier-item-actions">
        <button onclick="diminuerQuantite(${item.id})" aria-label="Réduire la quantité de ${item.nom}">-</button>
        <button onclick="supprimerDuPanier(${item.id})" aria-label="Supprimer ${item.nom} du panier">✕</button>
      </div>
    </div>
  `).join('');

  const total = panier.reduce((sum, item) => sum + (item.prix * item.quantite), 0);
  totalEl.innerHTML = `<span aria-label="Total du panier: ${total.toFixed(2)} euros">Total: ${total.toFixed(2)}€</span>`;
  totalEl.setAttribute('role', 'status');
  totalEl.setAttribute('aria-live', 'polite');
}

// Diminuer la quantité
function diminuerQuantite(id) {
  const item = panier.find(p => p.id === id);
  if (item) {
    item.quantite--;
    if (item.quantite === 0) {
      panier = panier.filter(p => p.id !== id);
    }
    sauvegarderPanier();
  }
}

// Supprimer du panier
function supprimerDuPanier(id) {
  panier = panier.filter(p => p.id !== id);
  sauvegarderPanier();
}

// Mettre à jour le compteur
function mettreAJourCompteur() {
  const count = panier.reduce((sum, item) => sum + item.quantite, 0);
  const countEl = document.getElementById('panier-count');
  countEl.textContent = count;
  countEl.setAttribute('aria-label', `${count} article${count > 1 ? 's' : ''} dans le panier`);
}

// Initialisation au chargement
document.addEventListener('DOMContentLoaded', () => {
  afficherProduits();
  afficherPanier();
  mettreAJourCompteur();
});

</script>
</body>
</html>
