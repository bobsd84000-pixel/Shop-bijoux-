<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Bijoux</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #f5f5f5; }
        
        header {
            background-color: #2c1810;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        h1 { font-size: 28px; }
        
        #panier-count {
            background-color: #d4af37;
            color: black;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        .container {
            max-width: 1200px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            padding: 0 20px;
        }
        
        #produits-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        
        .produit {
            background-color: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .produit h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #2c1810;
        }
        
        .prix {
            font-size: 20px;
            color: #d4af37;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        button {
            background-color: #d4af37;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            color: black;
        }
        
        button:hover { background-color: #c99d28; }
        
        #panier-container {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        #panier-container h2 { margin-bottom: 15px; color: #2c1810; }
        
        .panier-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .panier-item-info { flex: 1; }
        
        .panier-item-actions button {
            margin: 0 5px;
            padding: 5px 10px;
            font-size: 12px;
        }
        
        #panier-total {
            font-size: 18px;
            font-weight: bold;
            color: #d4af37;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #d4af37;
        }
        
        .panier-vide { color: #999; text-align: center; padding: 20px; }
    </style>
</head>
<body>
    <header>
        <h1>✨ Shop Bijoux ✨</h1>
        <div id="panier-count">0</div>
    </header>

    <div class="container">
        <div id="produits-container"></div>
        <div>
            <h2>Mon Panier</h2>
            <div id="panier-container"></div>
            <div id="panier-total"></div>
        </div>
    </div>

    <script>
        let panier = JSON.parse(localStorage.getItem('panier')) || [];

        const produits = [
            { id: 1, nom: 'Collier Or', prix: 45.99 },
            { id: 2, nom: 'Bracelet Argent', prix: 32.50 },
            { id: 3, nom: 'Boucles Perles', prix: 28.99 },
            { id: 4, nom: 'Bague Diamant', prix: 89.99 },
            { id: 5, nom: 'Pendentif Cristal', prix: 55.00 },
            { id: 6, nom: 'Chaîne Or Rose', prix: 65.99 },
            { id: 7, nom: 'Bracelet Or Massif', prix: 125.00 },
            { id: 8, nom: 'Bracelet Acier Inoxydable', prix: 42.99 },
            { id: 9, nom: 'Bracelet Cuivre', prix: 38.50 },
            { id: 10, nom: 'Bracelet Plaqué Or', prix: 58.99 }
        ];

        function sauvegarderPanier() {
            localStorage.setItem('panier', JSON.stringify(panier));
            afficherPanier();
            mettreAJourCompteur();
        }

        function afficherProduits() {
            const container = document.getElementById('produits-container');
            container.innerHTML = produits.map(p => `
                <div class="produit">
                    <h3>${p.nom}</h3>
                    <p class="prix">${p.prix.toFixed(2)}€</p>
                    <button onclick="ajouterAuPanier(${p.id}, '${p.nom}', ${p.prix})">Ajouter</button>
                </div>
            `).join('');
        }

        function ajouterAuPanier(id, nom, prix) {
            const item = panier.find(p => p.id === id);
            if (item) {
                item.quantite++;
            } else {
                panier.push({ id, nom, prix, quantite: 1 });
            }
            sauvegarderPanier();
        }

        function afficherPanier() {
            const container = document.getElementById('panier-container');
            const totalEl = document.getElementById('panier-total');

            if (panier.length === 0) {
                container.innerHTML = '<p class="panier-vide">Votre panier est vide</p>';
                totalEl.innerHTML = '';
                return;
            }

            container.innerHTML = panier.map(item => `
                <div class="panier-item">
                    <div class="panier-item-info">
                        <strong>${item.nom}</strong> - ${item.prix.toFixed(2)}€ x ${item.quantite}
                    </div>
                    <div class="panier-item-actions">
                        <button onclick="diminuerQuantite(${item.id})">-</button>
                        <button onclick="supprimerDuPanier(${item.id})">✕</button>
                    </div>
                </div>
            `).join('');

            const total = panier.reduce((sum, item) => sum + (item.prix * item.quantite), 0);
            totalEl.innerHTML = `Total: ${total.toFixed(2)}€`;
        }

        function diminuerQuantite(id) {
            const item = panier.find(p => p.id === id);
            if (item) {
                item.quantite--;
                if (item.quantite === 0) {
                    panier = panier.filter(p => p.id !== id);
                }
                sauvegarderPanier();
            }
        }

        function supprimerDuPanier(id) {
            panier = panier.filter(p => p.id !== id);
            sauvegarderPanier();
        }

        function mettreAJourCompteur() {
            const count = panier.reduce((sum, item) => sum + item.quantite, 0);
            document.getElementById('panier-count').textContent = count;
        }

        document.addEventListener('DOMContentLoaded', () => {
            afficherProduits();
            afficherPanier();
            mettreAJourCompteur();
        });
    </script>
</body>
</html>
