<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Bijoux</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Shop Bijoux</h1>
    <div class="panier-icon">
      <span>🛒 Panier</span>
      <span id="panier-count">0</span>
    </div>
  </header>

  <main>
    <section class="produits">
      <h2>Nos Produits</h2>
      <div id="produits-container" class="grid"></div>
    </section>

    <section class="panier-section">
      <h2>Mon Panier</h2>
      <div id="panier-container"></div>
      <div id="panier-total"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
